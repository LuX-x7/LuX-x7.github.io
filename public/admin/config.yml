backend:
  name: turbo-github
  turbo_site_id: 8ba77a83-962e-4b93-95de-5315ca5a7fc4
  branch: main
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: writing
    label: 随笔
    label_singular: 文章
    folder: content/writing
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 日期, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: 简介, name: description, widget: text, required: false}
      - {label: 正文, name: body, widget: markdown}
